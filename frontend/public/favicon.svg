<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c63ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#04040f"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="8" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.6"/>

  <!-- Letter A -->
  <text
    x="3" y="24"
    font-family="Inter, Arial, sans-serif"
    font-size="15"
    font-weight="900"
    fill="url(#g1)"
    letter-spacing="-0.5"
  >AS</text>

  <!-- Bottom accent line -->
  <rect x="4" y="27" width="24" height="1.5" rx="1" fill="url(#g1)" opacity="0.7"/>
</svg>